<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Testbench Baseplate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <h2>Backend Practice with AI </h2>
      <span class="status-badge">Ready for JS / API</span>
    </header>

    <!-- Message Display Window (Where JS will append messages) -->
    <section class="chat-box" id="chat-box">
      <!-- Sample Chatbot message -->
      <div class="message bot-message">
        <span class="sender">AI:</span>
        <p>Hello! I am ready to test your backend responses.</p>
      </div>

      <!-- Sample User Bubble -->
      <div class="message user-message">
        <span class="sender">User:</span>
        <p>This is a test prompt.</p>
      </div>
    </section>

    <!-- Input Form (Where JS will listen to submit events) -->
    <form class="chat-input-form" id="chat-form">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Type a prompt for the AI backend..." 
        autocomplete="off" 
        required 
      />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </main>

</body>
</html>
